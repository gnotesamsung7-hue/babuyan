<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Babuyan</title>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-400.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  --panel:#ffffff; --panel-2:#eef5e4; --ink:#3d2616; --ink-soft:#7a5a44;
  --accent:#f6c445; --accent-ink:#3d2616; --pink:#ec8fa3; --good:#4f9a3a;
  --line:#e2d7c8; --chip:rgba(255,255,255,.9); --bad:#c0392b;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24180f; --panel-2:#302117; --ink:#f7eadb; --ink-soft:#c9b29c;
    --accent:#f6c445; --accent-ink:#2a1a0e; --pink:#f0a0b2; --good:#7cc35a;
    --line:#4a3626; --chip:rgba(36,24,15,.88); --bad:#ff7a6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24180f; --panel-2:#302117; --ink:#f7eadb; --ink-soft:#c9b29c;
  --accent:#f6c445; --accent-ink:#2a1a0e; --pink:#f0a0b2; --good:#7cc35a;
  --line:#4a3626; --chip:rgba(36,24,15,.88); --bad:#ff7a6b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd8f0;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num,.display{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.01em}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.chip{background:var(--chip);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 rgba(61,38,22,.18);pointer-events:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#moneyChip{min-width:0}
#money{font-size:clamp(26px,7vw,38px);line-height:1;color:var(--ink)}
#rate{font-size:14px;font-weight:800;color:var(--good);margin-top:2px}
#rate.sick{color:var(--bad)}
#lvlChip{text-align:right;max-width:52vw}
#farmName{font-size:17px;line-height:1.1;color:var(--ink);max-width:48vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
#stageName{font-size:12px;line-height:1.2;color:var(--ink-soft);font-weight:800;margin-top:2px}
.lvlrow{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:5px}
#lvl{font-weight:800;font-size:13px;white-space:nowrap}
.bar{width:92px;height:9px;border-radius:9px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .25s}
#tools{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.iconbtn{pointer-events:auto;border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:12px;font-size:16px;cursor:pointer;box-shadow:0 2px 0 rgba(61,38,22,.18)}

#events{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.banner{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(61,38,22,.15)}
.banner.boost{border-color:var(--accent)}
.banner.sick{border-color:var(--bad)}
.banner button{border:0;border-radius:10px;padding:6px 10px;font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);cursor:pointer}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46vh + 12px);z-index:7;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--panel);color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 rgba(61,38,22,.2);animation:tin .3s ease-out;font-size:14px;line-height:1.4}
.toast h4{margin:0 0 2px;font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px}
.toast.lesson{border-left:6px solid var(--pink)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

#sheet{position:fixed;left:0;right:0;bottom:0;height:46vh;background:var(--panel);border-radius:22px 22px 0 0;z-index:8;display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(61,38,22,.12);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease}
#sheet.collapsed{transform:translateY(calc(100% - 58px - env(safe-area-inset-bottom,0px)))}
.tabs{display:flex;gap:4px;padding:8px 8px;align-items:center;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs>*{flex:none}
.tab{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:800;font-size:14px;padding:8px 9px;border-radius:12px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#3d1020;font-size:12px;margin-left:4px;line-height:20px}
.spacer{flex:1}
#buyx{border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;border-radius:12px;padding:6px 10px;cursor:pointer;min-width:58px}
#collapse{border:0;background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:6px 8px}
#list{overflow-y:auto;padding:8px 10px 14px;flex:1;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--panel-2);margin-bottom:8px}
.row.locked{opacity:.6}
.ic{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel);border-radius:14px;flex:none}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px}
.lv{font-family:"Lilita One",sans-serif;font-weight:400;color:var(--pink);margin-left:4px}
.ds{font-size:13px;color:var(--ink-soft);line-height:1.35}
.ds b{color:var(--good)}
.buy{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;padding:7px 10px;min-width:96px;cursor:pointer;box-shadow:0 3px 0 #c9971f;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.buy span{font-size:12px;font-weight:800}
.buy b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c9971f}
.buy:disabled{background:var(--line);box-shadow:none;color:var(--ink-soft);cursor:default}
.pips{display:flex;gap:3px;margin:3px 0}
.pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--pink)}
.stage{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;margin-bottom:6px}
.stage.done{background:var(--panel-2)}
.stage.now{border:2px solid var(--accent)}
.stage .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px;flex:none}
.stage.done .mk{background:var(--good);color:#fff}
.stage .nm{flex:1}
.stage .amt{font-family:"Lilita One",sans-serif;color:var(--ink-soft)}
.goalbar{height:12px;border-radius:8px;background:var(--panel-2);overflow:hidden;margin:4px 0 12px;border:1px solid var(--line)}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--accent))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--panel-2);border-radius:14px;padding:9px 12px}
.stat small{display:block;color:var(--ink-soft);font-weight:700;font-size:12px}
.stat b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:19px}
.hint{font-size:13px;color:var(--ink-soft);margin:2px 2px 10px;line-height:1.4}
.danger{border:0;background:transparent;color:var(--bad);font:inherit;font-weight:800;margin-top:14px;cursor:pointer;padding:8px 0}

.float{position:fixed;z-index:4;pointer-events:none;font-family:"Lilita One",sans-serif;font-size:22px;color:#fff;text-shadow:0 2px 0 #b5651d,0 0 6px rgba(0,0,0,.25);animation:fl 1s ease-out forwards;transform:translate(-50%,-50%)}
.float.gold{color:#ffe27a;font-size:28px}
@keyframes fl{to{transform:translate(-50%,-140%);opacity:0}}

#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(40,25,15,.45);padding:20px}
#modal.show{display:grid}
.card{background:var(--panel);border-radius:24px;padding:22px 22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(61,38,22,.25)}
.card .big{font-size:56px;line-height:1}
.card h2{font-family:"Lilita One",sans-serif;font-weight:400;font-size:26px;margin:8px 0 6px}
.card p{margin:0 0 14px;line-height:1.5;color:var(--ink-soft)}
.card .buy{margin:0 auto;min-width:160px;padding:11px 16px}
.card .buy b{font-size:19px}

@media (min-width:900px){
  #sheet{left:auto;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);bottom:14px;height:auto;width:390px;border-radius:22px}
  #sheet.collapsed{transform:none}
  #collapse{display:none}
  #hud{right:420px}
  #toasts{left:calc(50% - 200px);bottom:24px}
  #events{left:calc(50% - 200px)}
}
#taskChip{margin-top:8px;font-size:13px;font-weight:800;padding:7px 12px;cursor:pointer;max-width:58vw;line-height:1.3}
#taskChip .bar{width:100%;margin-top:4px}
.tk-ready{color:var(--good);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
#combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 150px);transform:translateX(-50%);z-index:6;font-size:34px;color:#fff;text-shadow:0 3px 0 #d0607a,0 0 8px rgba(0,0,0,.2);pointer-events:none;opacity:0;transition:opacity .25s,transform .1s;white-space:nowrap}
#combo.on{opacity:1}
#nameIn{width:100%;font:inherit;font-size:18px;font-weight:800;padding:11px 12px;border-radius:14px;border:2px solid var(--line);background:var(--panel-2);color:var(--ink);margin-bottom:14px;user-select:text;-webkit-user-select:text;text-align:center}
#nameIn:focus{outline:none;border-color:var(--pink)}
.link{display:block;margin:10px auto 0;border:0;background:none;color:var(--ink-soft);font:inherit;font-weight:800;cursor:pointer;padding:6px 10px}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
#joy{position:fixed;left:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.7);z-index:7;display:none;touch-action:none;box-shadow:0 3px 0 rgba(61,38,22,.15)}
#joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--chip);box-shadow:0 3px 0 rgba(61,38,22,.25);pointer-events:none}
#actBtns{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:7;display:none;flex-direction:column;align-items:flex-end;gap:10px}
#actBtn{border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:15px;padding:12px 16px;box-shadow:0 3px 0 #c9971f;cursor:pointer}
#actBtn:disabled{background:var(--line);color:var(--ink-soft);box-shadow:none}
#actBtns .iconbtn{width:52px;height:52px;border-radius:50%;font-size:22px}
#altBtns{display:flex;flex-direction:column;gap:8px}
#altBtns[hidden],#actBtn[hidden],#droneBtn[hidden]{display:none}
body.exploring #joy{display:block}
body.exploring #actBtns{display:flex}
#fpv{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45) 100%)}
body.fpv #fpv{display:block}
#fpv .cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border:2px solid rgba(255,255,255,.85);border-radius:50%}
#fpv .cross::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;background:#fff;border-radius:50%}
#fpv .rec{position:absolute;left:16px;top:calc(env(safe-area-inset-top,0px) + 120px);color:#ff4d4d;font-weight:800;font-family:ui-monospace,monospace;animation:pulse 1s infinite}
#fpvInfo{position:absolute;left:50%;transform:translateX(-50%);top:calc(50% + 40px);color:#fff;font-family:ui-monospace,monospace;font-weight:700;font-size:14px;text-shadow:0 1px 2px #000;white-space:pre}
#coop{position:fixed;inset:0;z-index:21;display:none;place-items:center;background:rgba(40,25,15,.45);padding:16px;overflow-y:auto}
#coop.show{display:grid}
#coopCard canvas{width:min(70vw,260px);height:auto;image-rendering:pixelated;border-radius:12px;background:#fff;display:block;margin:0 auto 4px}
#coopCard p{margin:6px 0 10px}
#coopCard textarea{width:100%;height:58px;font:inherit;font-size:12px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);color:var(--ink);margin:8px 0;user-select:text;-webkit-user-select:text;resize:none}
#coopCard .buy{width:100%}
.row2{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#scan{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#scan.show{display:flex}
#scanVid{width:min(92vw,520px);border-radius:16px;background:#111}
#scanMsg{color:#fff;font-weight:800;text-align:center}
@media (min-width:900px){#actBtns{right:420px;bottom:24px}#joy{bottom:24px}}
.prog{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.cat{font-size:17px;margin:14px 2px 6px;color:var(--ink)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.toast,.float{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="world" aria-label="Your pig farm"></canvas>

<div id="hud">
  <div>
    <div class="chip" id="moneyChip">
      <div id="money" class="num">₱0</div>
      <div id="rate">₱0/s</div>
    </div>
    <div class="chip" id="taskChip" role="button" tabindex="0" aria-label="Current task"></div>
  </div>
  <div>
    <div class="chip" id="lvlChip">
      <div id="farmName" class="display"></div>
      <div id="stageName">Backyard hog raiser</div>
      <div class="lvlrow"><span id="lvl">Farmer Lv 1</span><div class="bar"><i id="xpbar"></i></div></div>
    </div>
    <div id="tools">
      <button class="iconbtn" id="exploreBtn" aria-label="Explore">🚶</button>
      <button class="iconbtn" id="coopBtn" aria-label="Co-op">👥</button>
      <button class="iconbtn" id="soundBtn" aria-label="Sound on">🔊</button>
    </div>
  </div>
</div>

<div id="events"></div>
<div id="toasts"></div>
<div id="combo" class="display"></div>

<div id="sheet">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="farm" aria-selected="true">Farm</button>
    <button class="tab" role="tab" data-tab="learn" aria-selected="false">Learn<span id="ptsBadge"></span></button>
    <button class="tab" role="tab" data-tab="lab" aria-selected="false">Lab<span id="labBadge"></span></button>
    <button class="tab" role="tab" data-tab="home" aria-selected="false">Home<span id="homeBadge"></span></button>
    <button class="tab" role="tab" data-tab="goals" aria-selected="false">Goals</button>
    <div class="spacer"></div>
    <button id="buyx" aria-label="Buy amount">×1</button>
    <button id="collapse" aria-label="Hide panel">▾</button>
  </div>
  <div id="list"></div>
</div>

<div id="modal"><div class="card" id="card"></div></div>
<div id="coop"><div class="card" id="coopCard"></div></div>
<div id="scan"><video id="scanVid" muted playsinline></video><div id="scanMsg">Point the camera at the code</div><button class="buy" id="scanCancel"><b>Cancel</b></button></div>
<div id="joy" aria-label="Move"><div id="joyKnob"></div></div>
<div id="actBtns"><div id="altBtns" hidden><button class="iconbtn" id="upBtn" aria-label="Go up">▲</button><button class="iconbtn" id="dnBtn" aria-label="Go down">▼</button></div><button class="iconbtn" id="droneBtn" aria-label="Fly drone">🛸</button><button id="actBtn" hidden></button></div>
<div id="fpv"><div class="cross"></div><div class="rec">● REC  FPV</div><div id="fpvInfo"></div></div>

<script src="three.min.js"></script>
<script src="qrcode.js"></script>
<script src="jsQR.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KEY='piggery-tycoon-v1';

/* ---------- Game data ---------- */
const B=[
 {id:'pen',  name:'Pig pen',         icon:'🐖',cost:10,   inc:1,     desc:'Each level adds a pig to your herd.'},
 {id:'silo', name:'Feed silo',       icon:'🌾',cost:100,  inc:8,     desc:'Bulk feed helps your pigs grow faster.'},
 {id:'barn', name:'Breeding barn',   icon:'🛖',cost:1200, inc:50,    desc:'Sows raise litters of piglets here.'},
 {id:'shop', name:'Meat shop',       icon:'🏪',cost:14000,inc:320,   desc:'Sell fresh pork straight to the town.'},
 {id:'plant',name:'Processing plant',icon:'🏭',cost:1.6e5,inc:2000,  desc:'Make ham, bacon and longganisa.'},

 {id:'port', name:'Export port',     icon:'🚢',cost:3e8,  inc:5.6e5, desc:'Ship your pork brand across the world.'},

];

 {id:'mkt',  name:'Marketing',       icon:'📣',max:5,req:9,desc:'+30% income per rank'},
 {id:'lucky',name:'Lucky charm',     icon:'🍀',max:5,req:12,desc:'Golden piglets show up more often'},
 {id:'tycoon',name:'Tycoon mindset', icon:'💼',max:5,req:18,desc:'+50% income per rank'}
];
const STAGES=[[0,'Backyard hog raiser'],[1e3,'Small piggery'],[2.5e4,'Family farm'],[5e5,'Commercial farm'],[1e7,'Regional supplier'],[1e8,'National pork brand'],[1e9,'Pork billionaire'],[1e12,'Global pork empire'],[1e14,'Sky-high pork tycoon'],[1e16,'Pig of the galaxy']];
const FACTS=[
 'Pigs have very few sweat glands, so they roll in mud to stay cool.',

 'A sow usually gives birth to about 8 to 12 piglets in one litter.',

const lvOf=id=>S.lv[id]||0, sk=id=>S.sk[id]||0;
function need(L){return L<=1?0:20*Math.pow(2.1,L-1);}
function levelOf(x){return x<need(2)?1:1+Math.floor(Math.log(x/20)/Math.log(2.1)+1e-9);}
function spent(){let s=0;for(const k in S.sk)s+=S.sk[k];return s;}
function points(){return levelOf(S.lifetime)-1-spent();}
function rDone(id){return !!S.rs.done[id];}
function rEff(key){let v=1;for(const r of R)if(rDone(r.id)&&typeof r.eff[key]==='number')v*=r.eff[key];return v;}
function lifeBonus(){let b=HOMES[S.home||0].bonus;for(let i=0;i<(S.cars||0);i++)b+=CARS[i].bonus;return b;}
function rB(bid){let v=1;for(const r of R)if(rDone(r.id)&&r.eff.b&&r.eff.b[bid])v*=r.eff.b[bid];return v;}
function mult(){let m=(1+.2*sk('feed'))*(1+.15*sk('vet'))*(1+.3*sk('mkt'))*(1+.5*sk('tycoon'))*rEff('global')*(1+lifeBonus());if(S.boostT>0)m*=2;if(S.sickT>0)m*=.5;return m;}
function bInc(b,l){return b.inc*l*Math.pow(2,Math.floor(l/25))*rB(b.id);}
function income(){let s=0;for(const b of B)s+=bInc(b,lvOf(b.id));return s*mult();}
function costAt(b,l){return b.cost*Math.pow(1.15,l)*(1-.05*sk('smart'));}
function tapValue(){return Math.max(1,income()*.08)*(1+sk('hands'))*rEff('tap')*(S.fiestaT>0?5:1);}
let buyMode=1;
function bulk(b){const c0=costAt(b,lvOf(b.id));let n=buyMode;if(buyMode==='max'){n=Math.floor(Math.log(S.money*.15/c0+1)/Math.log(1.15));if(n<1)n=1;}return{n,cost:c0*(Math.pow(1.15,n)-1)/.15};}
function stageIdx(){let i=0;STAGES.forEach((s,k)=>{if(S.lifetime>=s[0])i=k;});return i;}
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const u=['','K','M','B','T','Qa','Qi','Sx'];let e=Math.min(u.length-1,Math.floor(Math.log10(n)/3));const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[e];
}

let AC=null;
function oink(pitch){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';f.type='lowpass';f.frequency.value=900;
    o.frequency.setValueAtTime(260*pitch,t);o.frequency.exponentialRampToValueAtTime(140*pitch,t+.18);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);
  }catch(e){}
}
function chime(){

}

const cam={theta:.75,phi:.95,r:46,tr:46};let zMin=16,zMax=150;const camT=new THREE.Vector3(0,1,-2),camTgoal=new THREE.Vector3(0,1,-2);
function placeCam(){camT.lerp(camTgoal,.15);camera.position.set(camT.x+Math.sin(cam.theta)*Math.sin(cam.phi)*cam.r,camT.y+Math.cos(cam.phi)*cam.r,camT.z+Math.cos(cam.theta)*Math.sin(cam.phi)*cam.r);camera.lookAt(camT);}
const ptrs=new Map();let downPos=null,dragged=false,pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){downPos={x:e.clientX,y:e.clientY};dragged=false;}if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dragged=true;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){cam.tr=Math.max(zMin,Math.min(zMax,cam.tr*pinch0/d));}pinch0=d;return;}
  if(downPos&&Math.hypot(cur.x-downPos.x,cur.y-downPos.y)>7)dragged=true;
  if(dragged){if(ctl.mode==='drone'){drone.yaw-=(cur.x-prev.x)*.005;drone.pitch=Math.max(-1.3,Math.min(.7,drone.pitch-(cur.y-prev.y)*.004));}else{cam.theta-=(cur.x-prev.x)*.006;cam.phi=Math.max(.35,Math.min(1.35,cam.phi-(cur.y-prev.y)*.005));}}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(ptrs.size===0){if(!dragged)tap(e.clientX,e.clientY);downPos=null;}}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);downPos=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.tr=Math.max(zMin,Math.min(zMax,cam.tr*(1+Math.sign(e.deltaY)*.1)));},{passive:false});

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let combo=0,lastTap=0,comboTO=0;
function tap(x,y){
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const targets=golden?[golden,...pigs]:pigs;
  const hit=ray.intersectObjects(targets,true)[0];
  if(!hit)return;
  let o=hit.object;while(o&&!o.userData.pig)o=o.parent;if(!o)return;
  o.userData.hop=.35;
  if(o.userData.gold){
    if(role==='guest'){send({t:'gold'});floatText('✨',x,y,true);chime();pigGroup.remove(golden);golden=null;return;}
    const v=(income()*30+100)*rEff('gold');earn(v);if(S.rs.cur)S.rs.left-=3;S.golden++;floatText('+₱'+fmt(v),x,y,true);chime();
    toast('Golden piglet!','You caught it and sold it to a collector for ₱'+fmt(v)+'.');
    pigGroup.remove(golden);golden=null;goldenNext=gNext();
  }else{
    const now=performance.now();combo=now-lastTap<700?combo+1:1;lastTap=now;const cm=1+Math.min(combo,50)*.04;
    const v=tapValue()*cm;if(role==='guest')send({t:'tap',cm});else{earn(v);S.taps++;if(S.rs.cur)S.rs.left-=.35;}floatText('+₱'+fmt(v),x,y,false);oink(.85+Math.random()*.4+Math.min(combo,30)*.01);
    if(combo>=5){const c=$('combo');c.textContent='Combo ×'+combo+'  ('+cm.toFixed(1)+'x)';c.classList.add('on');c.style.transform='translateX(-50%) scale(1.15)';setTimeout(()=>c.style.transform='translateX(-50%) scale(1)',90);clearTimeout(comboTO);comboTO=setTimeout(()=>c.classList.remove('on'),800);}
  }
}

function rCount(){return Object.keys(S.rs.done).length;}
function newTask(){const n=S.tasksDone||0;let types=['tap','ups','earn','build'];if(lvOf('pen')>=3)types.push('gold');if(R.some(r=>!rDone(r.id)&&reqMet(r)))types.push('research');
  const cur=(S.tasks||[]).map(t=>t.type);let pool=types.filter(t=>!cur.includes(t));if(!pool.length)pool=types;const type=pool[Math.floor(Math.random()*pool.length)],t={type};
  if(type==='tap'){t.target=20+Math.min(80,n*4);t.base=S.taps;}
  else if(type==='ups'){t.target=5+Math.min(20,n);t.base=S.ups||0;}
  else if(type==='earn'){t.target=Math.max(200,income()*150);t.base=S.lifetime;}
  else if(type==='gold'){t.target=1;t.base=S.golden;}
  else if(type==='research'){t.target=1;t.base=rCount();}
  else{const owned=B.filter(b=>lvOf(b.id)>0);const b=owned[Math.floor(Math.random()*owned.length)];t.bid=b.id;t.target=lvOf(b.id)+5+Math.floor(Math.random()*5);}
  return t;}
function taskProg(t){switch(t.type){case 'tap':return S.taps-t.base;case 'ups':return (S.ups||0)-t.base;case 'earn':return S.lifetime-t.base;case 'gold':return S.golden-t.base;case 'research':return rCount()-t.base;default:return lvOf(t.bid);}}
function taskText(t){switch(t.type){case 'tap':return 'Pat '+t.target+' pigs';case 'ups':return 'Upgrade buildings '+t.target+' times';case 'earn':return 'Earn ₱'+fmt(t.target);case 'gold':return 'Catch a golden piglet';case 'research':return 'Finish a research project';default:return 'Get your '+B.find(b=>b.id===t.bid).name.toLowerCase()+' to Lv '+t.target;}}
function taskIcon(t){return {tap:'✋',ups:'🔨',earn:'💰',gold:'✨',research:'🔬',build:'🏗️'}[t.type];}
function taskDone(t){return taskProg(t)>=t.target;}
function ensureTasks(){S.tasks=S.tasks||[];while(S.tasks.length<3)S.tasks.push(newTask());}
function taskReward(){return Math.max(50,income()*45)*(1+Math.min(10,S.tasksDone||0)*.1);}
function claimTask(i){if(role==='guest'){send({t:'act',fn:'claim',a:[i]});return;}const t=S.tasks[i];if(!t||!taskDone(t))return;const v=taskReward();earn(v);S.tasksDone=(S.tasksDone||0)+1;S.tasks.splice(i,1);S.tasks.push(newTask());chime();floatText('+₱'+fmt(v),innerWidth/2,innerHeight*.4,true);toast('Task complete!','You earned ₱'+fmt(v)+'. A new task is waiting.');refresh();save();}

const offRate=.1+.18*sk('auto');
build();
if(away>60&&S.lifetime>0){
  const base=income()/(S.boostT>0?2:1);
  const secs=Math.min(away,8*3600),got=base*secs*offRate;
  if(got>0){earn(got);modal('🐷','Welcome back!',`Your farm kept working while you were away and earned ₱${fmt(got)}. Learn Farm automation to earn more while you are gone.`,'Collect');}
}else if(S.lifetime===0){
  modal('🧑‍🌾','Welcome to Babuyan','You are a young farmer with one pig and a dream. Tap your pig to earn cash, build up your farm, and learn as you level up. Can you grow it into a billion-peso business?','Start farming');
}
if(!S.farmName)nameModal(true);
checkDaily();
S.lastLevel=Math.max(S.lastLevel,levelOf(S.lifetime));S.stage=Math.max(S.stage||0,stageIdx());
addEventListener('visibilitychange',()=>{if(document.hidden)save();else{last=performance.now();checkDaily();}});
addEventListener('pagehide',save);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
