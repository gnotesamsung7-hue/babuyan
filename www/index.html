<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Babuyan</title>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-400.woff2) format("woff2");font-weight:400 500;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Nunito";src:url(fonts/nunito-800.woff2) format("woff2");font-weight:800;font-display:swap}
:root{
  --panel:#ffffff; --panel-2:#eef5e4; --ink:#3d2616; --ink-soft:#7a5a44;
  --accent:#f6c445; --accent-ink:#3d2616; --pink:#ec8fa3; --good:#4f9a3a;
  --line:#e2d7c8; --chip:rgba(255,255,255,.9); --bad:#c0392b;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#24180f; --panel-2:#302117; --ink:#f7eadb; --ink-soft:#c9b29c;
    --accent:#f6c445; --accent-ink:#2a1a0e; --pink:#f0a0b2; --good:#7cc35a;
    --line:#4a3626; --chip:rgba(36,24,15,.88); --bad:#ff7a6b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#24180f; --panel-2:#302117; --ink:#f7eadb; --ink-soft:#c9b29c;
  --accent:#f6c445; --accent-ink:#2a1a0e; --pink:#f0a0b2; --good:#7cc35a;
  --line:#4a3626; --chip:rgba(36,24,15,.88); --bad:#ff7a6b; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#9fd8f0;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.num,.display{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.01em}

#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.chip{background:var(--chip);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 rgba(61,38,22,.18);pointer-events:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#moneyChip{min-width:0}
#money{font-size:clamp(26px,7vw,38px);line-height:1;color:var(--ink)}
#rate{font-size:14px;font-weight:800;color:var(--good);margin-top:2px}
#rate.sick{color:var(--bad)}
#lvlChip{text-align:right;max-width:52vw}
#stageName{font-size:15px;line-height:1.15;color:var(--ink)}
.lvlrow{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:5px}
#lvl{font-weight:800;font-size:13px;white-space:nowrap}
.bar{width:92px;height:9px;border-radius:9px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .25s}
#tools{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.iconbtn{pointer-events:auto;border:0;background:var(--chip);color:var(--ink);width:34px;height:34px;border-radius:12px;font-size:16px;cursor:pointer;box-shadow:0 2px 0 rgba(61,38,22,.18)}

#events{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 92px);z-index:6;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.banner{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:7px 10px;font-weight:800;font-size:14px;box-shadow:0 3px 0 rgba(61,38,22,.15)}
.banner.boost{border-color:var(--accent)}
.banner.sick{border-color:var(--bad)}
.banner button{border:0;border-radius:10px;padding:6px 10px;font:inherit;font-weight:800;background:var(--accent);color:var(--accent-ink);cursor:pointer}

#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(46vh + 12px);z-index:7;display:flex;flex-direction:column;gap:8px;width:min(92vw,400px);pointer-events:none}
.toast{background:var(--panel);color:var(--ink);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 rgba(61,38,22,.2);animation:tin .3s ease-out;font-size:14px;line-height:1.4}
.toast h4{margin:0 0 2px;font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px}
.toast.lesson{border-left:6px solid var(--pink)}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

#sheet{position:fixed;left:0;right:0;bottom:0;height:46vh;background:var(--panel);border-radius:22px 22px 0 0;z-index:8;display:flex;flex-direction:column;box-shadow:0 -4px 0 rgba(61,38,22,.12);padding-bottom:env(safe-area-inset-bottom,0px);transition:transform .25s ease}
#sheet.collapsed{transform:translateY(calc(100% - 58px - env(safe-area-inset-bottom,0px)))}
.tabs{display:flex;gap:4px;padding:8px 8px;align-items:center;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs>*{flex:none}
.tab{border:0;background:transparent;color:var(--ink-soft);font:inherit;font-weight:800;font-size:14px;padding:8px 9px;border-radius:12px;cursor:pointer;position:relative}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--pink);color:#3d1020;font-size:12px;margin-left:4px;line-height:20px}
.spacer{flex:1}
#buyx{border:2px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-weight:800;border-radius:12px;padding:6px 10px;cursor:pointer;min-width:58px}
#collapse{border:0;background:transparent;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:6px 8px}
#list{overflow-y:auto;padding:8px 10px 14px;flex:1;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;align-items:center;padding:10px;border-radius:16px;background:var(--panel-2);margin-bottom:8px}
.row.locked{opacity:.6}
.ic{font-size:30px;width:46px;height:46px;display:grid;place-items:center;background:var(--panel);border-radius:14px;flex:none}
.info{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px}
.lv{font-family:"Lilita One",sans-serif;font-weight:400;color:var(--pink);margin-left:4px}
.ds{font-size:13px;color:var(--ink-soft);line-height:1.35}
.ds b{color:var(--good)}
.buy{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;padding:7px 10px;min-width:96px;cursor:pointer;box-shadow:0 3px 0 #c9971f;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.buy span{font-size:12px;font-weight:800}
.buy b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:17px}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #c9971f}
.buy:disabled{background:var(--line);box-shadow:none;color:var(--ink-soft);cursor:default}
.pips{display:flex;gap:3px;margin:3px 0}
.pips i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--pink)}
.stage{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:14px;margin-bottom:6px}
.stage.done{background:var(--panel-2)}
.stage.now{border:2px solid var(--accent)}
.stage .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px;flex:none}
.stage.done .mk{background:var(--good);color:#fff}
.stage .nm{flex:1}
.stage .amt{font-family:"Lilita One",sans-serif;color:var(--ink-soft)}
.goalbar{height:12px;border-radius:8px;background:var(--panel-2);overflow:hidden;margin:4px 0 12px;border:1px solid var(--line)}
.goalbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--accent))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--panel-2);border-radius:14px;padding:9px 12px}
.stat small{display:block;color:var(--ink-soft);font-weight:700;font-size:12px}
.stat b{font-family:"Lilita One",sans-serif;font-weight:400;font-size:19px}
.hint{font-size:13px;color:var(--ink-soft);margin:2px 2px 10px;line-height:1.4}
.danger{border:0;background:transparent;color:var(--bad);font:inherit;font-weight:800;margin-top:14px;cursor:pointer;padding:8px 0}

.float{position:fixed;z-index:4;pointer-events:none;font-family:"Lilita One",sans-serif;font-size:22px;color:#fff;text-shadow:0 2px 0 #b5651d,0 0 6px rgba(0,0,0,.25);animation:fl 1s ease-out forwards;transform:translate(-50%,-50%)}
.float.gold{color:#ffe27a;font-size:28px}
@keyframes fl{to{transform:translate(-50%,-140%);opacity:0}}

#modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(40,25,15,.45);padding:20px}
#modal.show{display:grid}
.card{background:var(--panel);border-radius:24px;padding:22px 22px 18px;max-width:380px;width:100%;text-align:center;box-shadow:0 6px 0 rgba(61,38,22,.25)}
.card .big{font-size:56px;line-height:1}
.card h2{font-family:"Lilita One",sans-serif;font-weight:400;font-size:26px;margin:8px 0 6px}
.card p{margin:0 0 14px;line-height:1.5;color:var(--ink-soft)}
.card .buy{margin:0 auto;min-width:160px;padding:11px 16px}
.card .buy b{font-size:19px}

@media (min-width:900px){
  #sheet{left:auto;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);bottom:14px;height:auto;width:390px;border-radius:22px}
  #sheet.collapsed{transform:none}
  #collapse{display:none}
  #hud{right:420px}
  #toasts{left:calc(50% - 200px);bottom:24px}
  #events{left:calc(50% - 200px)}
}
.prog{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--good);transition:width .2s}
.cat{font-size:17px;margin:14px 2px 6px;color:var(--ink)}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.toast,.float{animation-duration:.01s}}
</style>
</head>
<body>
<canvas id="world" aria-label="Your pig farm"></canvas>

<div id="hud">
  <div class="chip" id="moneyChip">
    <div id="money" class="num">₱0</div>
    <div id="rate">₱0/s</div>
  </div>
  <div>
    <div class="chip" id="lvlChip">
      <div id="stageName" class="display">Backyard hog raiser</div>
      <div class="lvlrow"><span id="lvl">Farmer Lv 1</span><div class="bar"><i id="xpbar"></i></div></div>
    </div>
    <div id="tools">
      <button class="iconbtn" id="soundBtn" aria-label="Sound on">🔊</button>
    </div>
  </div>
</div>

<div id="events"></div>
<div id="toasts"></div>

<div id="sheet">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="farm" aria-selected="true">Farm</button>
    <button class="tab" role="tab" data-tab="learn" aria-selected="false">Learn<span id="ptsBadge"></span></button>
    <button class="tab" role="tab" data-tab="lab" aria-selected="false">Lab<span id="labBadge"></span></button>
    <button class="tab" role="tab" data-tab="home" aria-selected="false">Home<span id="homeBadge"></span></button>
    <button class="tab" role="tab" data-tab="goals" aria-selected="false">Goals</button>
    <div class="spacer"></div>
    <button id="buyx" aria-label="Buy amount">×1</button>
    <button id="collapse" aria-label="Hide panel">▾</button>
  </div>
  <div id="list"></div>
</div>

<div id="modal"><div class="card" id="card"></div></div>

/* ---------- State ---------- */
function fresh(){return {money:0,lifetime:0,lv:{pen:1},sk:{},golden:0,taps:0,won:false,lastLevel:1,boostT:0,sickT:0,t:Date.now(),sound:true,fact:0,rs:{done:{},cur:null,left:0},fiestaT:0,stage:0,home:0,cars:0};}
let S=fresh();
try{const r=localStorage.getItem(KEY); if(r){const d=JSON.parse(r); S=Object.assign(fresh(),d); S.lv=Object.assign({pen:1},d.lv||{}); S.sk=d.sk||{};S.rs=Object.assign({done:{},cur:null,left:0},d.rs||{});S.rs.done=S.rs.done||{};}}catch(e){}
function save(){S.t=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const lvOf=id=>S.lv[id]||0, sk=id=>S.sk[id]||0;
function need(L){return L<=1?0:20*Math.pow(2.1,L-1);}
function levelOf(x){return x<need(2)?1:1+Math.floor(Math.log(x/20)/Math.log(2.1)+1e-9);}
function spent(){let s=0;for(const k in S.sk)s+=S.sk[k];return s;}
function points(){return levelOf(S.lifetime)-1-spent();}
function rDone(id){return !!S.rs.done[id];}
function rEff(key){let v=1;for(const r of R)if(rDone(r.id)&&typeof r.eff[key]==='number')v*=r.eff[key];return v;}
function lifeBonus(){let b=HOMES[S.home||0].bonus;for(let i=0;i<(S.cars||0);i++)b+=CARS[i].bonus;return b;}
function rB(bid){let v=1;for(const r of R)if(rDone(r.id)&&r.eff.b&&r.eff.b[bid])v*=r.eff.b[bid];return v;}
function mult(){let m=(1+.2*sk('feed'))*(1+.15*sk('vet'))*(1+.3*sk('mkt'))*(1+.5*sk('tycoon'))*rEff('global')*(1+lifeBonus());if(S.boostT>0)m*=2;if(S.sickT>0)m*=.5;return m;}
function bInc(b,l){return b.inc*l*Math.pow(2,Math.floor(l/25))*rB(b.id);}
function income(){let s=0;for(const b of B)s+=bInc(b,lvOf(b.id));return s*mult();}
function costAt(b,l){return b.cost*Math.pow(1.15,l)*(1-.05*sk('smart'));}
function tapValue(){return Math.max(1,income()*.08)*(1+sk('hands'))*rEff('tap')*(S.fiestaT>0?5:1);}
let buyMode=1;
function bulk(b){const c0=costAt(b,lvOf(b.id));let n=buyMode;if(buyMode==='max'){n=Math.floor(Math.log(S.money*.15/c0+1)/Math.log(1.15));if(n<1)n=1;}return{n,cost:c0*(Math.pow(1.15,n)-1)/.15};}
function stageIdx(){let i=0;STAGES.forEach((s,k)=>{if(S.lifetime>=s[0])i=k;});return i;}
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();
  const u=['','K','M','B','T','Qa','Qi','Sx'];let e=Math.min(u.length-1,Math.floor(Math.log10(n)/3));const v=n/Math.pow(1000,e);
  return (v<10?v.toFixed(2):v<100?v.toFixed(1):Math.floor(v))+u[e];
}

/* ---------- Sound ---------- */
let AC=null;
function oink(pitch){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';f.type='lowpass';f.frequency.value=900;
    o.frequency.setValueAtTime(260*pitch,t);o.frequency.exponentialRampToValueAtTime(140*pitch,t+.18);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
    o.connect(f);f.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);
  }catch(e){}
}
function chime(){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;[660,880,1320].forEach((fq,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(.0001,t+i*.08);g.gain.exponentialRampToValueAtTime(.12,t+i*.08+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.08+.3);o.connect(g);g.connect(AC.destination);o.start(t+i*.08);o.stop(t+i*.08+.35);});}catch(e){}
}

function makePig(gold){
  const look=gold?'gold':skin();let m=pigMat;
  if(look==='gold')m=goldMat;else if(look==='black')m=blackMat;else if(look==='rainbow'){m=new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),.75,.68)});bodyMats.push(m);}
  const sm=gold?goldMat:snoutMat,g=new THREE.Group();
  const body=mk(PG.body,m,0,.95,0);body.scale.set(1.3,.9,.9);g.add(body);
  if(look==='spots')[[.2,1.78,.25],[-.5,1.62,-.42],[-.3,1.25,.78],[.5,1.2,-.75]].forEach(p=>{const s=mk(spotGeo,spotMat,p[0],p[1],p[2]);s.scale.set(1,.45,1);g.add(s);});
  g.add(mk(PG.head,m,1.25,1.12,0));
  const sn=mk(PG.snout,sm,1.82,1.02,0);sn.rotation.z=Math.PI/2;g.add(sn);
  g.add(mk(PG.eye,eyeMat,1.68,1.33,.24));g.add(mk(PG.eye,eyeMat,1.68,1.33,-.24));
  [.33,-.33].forEach(z=>{const e=mk(PG.ear,sm,1.15,1.72,z);e.rotation.z=-.5;g.add(e);});
  const legs=[];[[.62,.42],[.62,-.42],[-.62,.42],[-.62,-.42]].forEach(p=>{const l=mk(PG.leg,m,p[0],.3,p[1]);legs.push(l);g.add(l);});
  const t=mk(PG.tail,sm,-1.32,1.1,0);t.rotation.y=Math.PI/2;g.add(t);
  g.userData={pig:true,gold:!!gold,legs,tx:0,tz:0,wait:Math.random()*2,hop:0,ph:Math.random()*6};
  g.scale.setScalar((gold?.5:.55+Math.random()*.12)*(!gold&&rDone('g7')?1.45:1));
  g.position.set((Math.random()*2-1)*(PEN.x-1.5),0,(Math.random()*2-1)*(PEN.z-1.5));

const ptrs=new Map();let downPos=null,dragged=false,pinch0=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptrs.size===1){downPos={x:e.clientX,y:e.clientY};dragged=false;}if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dragged=true;}});
canvas.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);const cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch0){cam.tr=Math.max(16,Math.min(150,cam.tr*pinch0/d));}pinch0=d;return;}
  if(downPos&&Math.hypot(cur.x-downPos.x,cur.y-downPos.y)>7)dragged=true;
  if(dragged){cam.theta-=(cur.x-prev.x)*.006;cam.phi=Math.max(.35,Math.min(1.35,cam.phi-(cur.y-prev.y)*.005));}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;if(ptrs.size===0){if(!dragged)tap(e.clientX,e.clientY);downPos=null;}}
canvas.addEventListener('pointerup',endPtr);canvas.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);downPos=null;});
canvas.addEventListener('wheel',e=>{e.preventDefault();cam.tr=Math.max(16,Math.min(150,cam.tr*(1+Math.sign(e.deltaY)*.1)));},{passive:false});

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function tap(x,y){
  ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const targets=golden?[golden,...pigs]:pigs;
  const hit=ray.intersectObjects(targets,true)[0];
  if(!hit)return;
  let o=hit.object;while(o&&!o.userData.pig)o=o.parent;if(!o)return;
  o.userData.hop=.35;
  if(o.userData.gold){
    const v=(income()*30+100)*rEff('gold');earn(v);if(S.rs.cur)S.rs.left-=3;S.golden++;floatText('+₱'+fmt(v),x,y,true);chime();
    toast('Golden piglet!','You caught it and sold it to a collector for ₱'+fmt(v)+'.');
    pigGroup.remove(golden);golden=null;goldenNext=gNext();
  }else{const v=tapValue();earn(v);S.taps++;if(S.rs.cur)S.rs.left-=.35;floatText('+₱'+fmt(v),x,y,false);oink(.85+Math.random()*.4);}
}

    [['Your house',HOMES,'home'],['Your garage',CARS,'car']].forEach(([title,arr,kind])=>{const t=document.createElement('div');t.className='cat display';t.textContent=title;list.appendChild(t);
      arr.forEach((it,i)=>{const row=document.createElement('div');row.className='row';row.id='r-'+it.id;
        row.innerHTML=`<div class="ic">${it.icon}</div><div class="info"><div class="nm">${it.name}</div><div class="ds" id="ds-${it.id}"></div></div><button class="buy" id="bt-${it.id}"></button>`;
        list.appendChild(row);row.querySelector('button').onclick=()=>buyLife(kind,i);});});
  }else{
    const w=document.createElement('div');w.id='goalWrap';list.appendChild(w);
    STAGES.forEach((s,i)=>{const r=document.createElement('div');r.className='stage';r.id='st-'+i;r.innerHTML=`<div class="mk">${i+1}</div><div class="nm">${s[1]}</div><div class="amt">₱${fmt(s[0])}</div>`;list.appendChild(r);});
    const st=document.createElement('div');st.className='stats';st.id='stats';list.appendChild(st);
    const rs=document.createElement('button');rs.className='danger';rs.textContent='Start a new farm';rs.onclick=()=>modal('🐷','Start a new farm?','This erases your whole farm and progress. You cannot undo it.','Erase and restart',()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();});list.appendChild(rs);
  }
  refresh();
}
function refresh(){
  const inc=income();
  $('money').textContent='₱'+fmt(S.money);
  $('rate').textContent='₱'+fmt(inc)+'/s'+(S.boostT>0?'  ×2 boom':'')+(S.sickT>0?'  sick pigs':'');
  $('rate').className=S.sickT>0?'sick':'';
  const L=levelOf(S.lifetime);$('lvl').textContent='Farmer Lv '+L;
  $('xpbar').style.width=Math.min(100,(S.lifetime-need(L))/(need(L+1)-need(L))*100)+'%';
  $('stageName').textContent=STAGES[stageIdx()][1];
  const p=points();$('ptsBadge').innerHTML=p>0?`<span class="badge">${p}</span>`:'';
  const avail=!S.rs.cur&&R.some(r=>!rDone(r.id)&&reqMet(r)&&S.money>=r.cost);const lb=S.rs.cur?'<span class="badge">🔬</span>':avail?'<span class="badge">!</span>':'';if($('labBadge').innerHTML!==lb)$('labBadge').innerHTML=lb;
  {const hn=HOMES[(S.home||0)+1],cn=CARS[S.cars||0];const hb=(hn&&L>=hn.req&&S.money>=hn.cost)||(cn&&L>=cn.req&&S.money>=cn.cost)?'<span class="badge">!</span>':'';if($('homeBadge').innerHTML!==hb)$('homeBadge').innerHTML=hb;}
  if(tab==='farm'){
    let teaser=false;
    B.forEach((b,i)=>{const r=$('r-'+b.id),l=lvOf(b.id),bt=$('bt-'+b.id);
      const open=i===0||lvOf(B[i-1].id)>0;
      if(!open){if(teaser){r.hidden=true;return;}teaser=true;r.hidden=false;r.classList.add('locked');$('ic-'+b.id).textContent='❔';$('nm-'+b.id).textContent='???';$('lv-'+b.id).textContent='';$('ds-'+b.id).textContent='Build the '+B[i-1].name.toLowerCase()+' to unlock.';bt.disabled=true;bt.innerHTML='<span>Locked</span>';return;}
      r.hidden=false;r.classList.remove('locked');$('ic-'+b.id).textContent=b.icon;$('nm-'+b.id).textContent=b.name;$('lv-'+b.id).textContent=l?' Lv '+l:'';
      const q=bulk(b),m=mult();const gain=(bInc(b,l+q.n)-bInc(b,l))*m;
      $('ds-'+b.id).innerHTML=(l?`Makes ₱${fmt(bInc(b,l)*m)}/s. `:b.desc+' ')+`<b>+₱${fmt(gain)}/s</b>`;
      bt.innerHTML=`<span>${l?'Upgrade':'Build'}${q.n>1?' ×'+q.n:''}</span><b>₱${fmt(q.cost)}</b>`;bt.disabled=S.money<q.cost;});
  }else if(tab==='learn'){
    $('learnHint').textContent=p>0?`You have ${p} skill point${p>1?'s':''} to spend. You get one every time your farmer levels up.`:`Level up to get skill points. Next level at ₱${fmt(need(L+1))} earned in total.`;
    SK.forEach(s=>{const k=sk(s.id),bt=$('bt-'+s.id);$('pp-'+s.id).querySelectorAll('i').forEach((e,i)=>e.classList.toggle('on',i<k));
      if(k>=s.max){bt.disabled=true;bt.innerHTML='<span>Mastered</span><b>★</b>';}
      else if(L<s.req){bt.disabled=true;bt.innerHTML=`<span>Needs</span><b>Lv ${s.req}</b>`;}
      else{bt.disabled=p<1;bt.innerHTML='<span>Learn</span><b>1 point</b>';}});
    $('factBox').textContent='Farm lesson: '+FACTS[S.fact%FACTS.length];
  }else if(tab==='lab'){
    const cur=S.rs.cur,cr=cur&&R.find(r=>r.id===cur);
    $('labHint').textContent=cr?`Researching ${cr.name}. Tap pigs to speed it up!`:'Pick a project to research. One runs at a time, and tapping pigs makes it go faster.';
    const shown={};
    R.forEach(r=>{const row=$('r-'+r.id),bt=$('bt-'+r.id),ds=$('ds-'+r.id),pg=$('pg-'+r.id);if(!row)return;
      pg.hidden=true;row.classList.remove('locked');row.hidden=false;
      if(rDone(r.id)){ds.textContent=r.txt;bt.disabled=true;bt.innerHTML='<span>Done</span><b>✓</b>';return;}
      if(cur===r.id){ds.textContent=r.txt;pg.hidden=false;pg.firstChild.style.width=Math.max(0,100-S.rs.left/r.time*100)+'%';bt.disabled=true;bt.innerHTML=`<span>Working</span><b>${Math.max(0,Math.ceil(S.rs.left))}s</b>`;return;}
      if(!reqMet(r)){if(shown[r.cat]){row.hidden=true;return;}shown[r.cat]=true;row.classList.add('locked');ds.textContent=reqText(r);bt.disabled=true;bt.innerHTML='<span>Locked</span><b>🔒</b>';return;}
      ds.textContent=r.txt+` Takes ${r.time}s.`;bt.disabled=!!cur||S.money<r.cost;bt.innerHTML=`<span>Research</span><b>₱${fmt(r.cost)}</b>`;});
  }else if(tab==='home'){
    $('homeHint').textContent=`New homes and rides unlock as your farmer levels up. Your comforts add ${Math.round(lifeBonus()*100)}% to all income. A happy farmer works harder!`;
    HOMES.forEach((it,i)=>lifeRow(it,i,'home'));CARS.forEach((it,i)=>lifeRow(it,i,'car'));
  }else{
    const si=stageIdx();
    const next=STAGES[Math.min(si+1,STAGES.length-1)][0];const prev=STAGES[si][0];
    const goal=S.won?1e16:1e9,pct=Math.min(100,Math.log10(Math.max(1,S.lifetime))/Math.log10(goal)*100);
    $('goalWrap').innerHTML=`<div class="nm">${S.won?'Road to pig of the galaxy':'Road to a billion pesos'}</div><div class="goalbar"><i style="width:${pct}%"></i></div><p class="hint">${S.lifetime>=goal?'You did it. Keep growing toward a global empire.':'Total earned: ₱'+fmt(S.lifetime)+' of ₱'+fmt(goal)+'. Next stage at ₱'+fmt(next)+'.'}</p>`;
    STAGES.forEach((s,i)=>{const r=$('st-'+i);r.className='stage'+(S.lifetime>=s[0]?' done':'')+(i===si+1?' now':'');r.querySelector('.mk').textContent=S.lifetime>=s[0]?'✓':i+1;});
    const herd=lvOf('pen')*5+lvOf('barn')*20+lvOf('plant')*40;
    $('stats').innerHTML=`<div class="stat"><small>Pigs in your herd</small><b>${fmt(herd)}</b></div><div class="stat"><small>Total earned</small><b>₱${fmt(S.lifetime)}</b></div><div class="stat"><small>Pigs patted</small><b>${fmt(S.taps)}</b></div><div class="stat"><small>Golden piglets</small><b>${S.golden}</b></div>`;
  }
}
function buy(b){const l=lvOf(b.id),q=bulk(b);if(S.money<q.cost)return;S.money-=q.cost;S.lv[b.id]=l+q.n;
  const g=G[b.id];g.visible=true;g.userData.pop=1;
  if(l===0&&b.id!=='pen'){toast('New: '+b.name,b.desc);chime();}else oink(1.2);
  if(b.id==='pen')syncPigs();if(b.id==='trucks')syncTrucks();refresh();save();}
function learn(s){if(points()<1||sk(s.id)>=s.max||levelOf(S.lifetime)<s.req)return;S.sk[s.id]=sk(s.id)+1;chime();toast('Learned: '+s.name,'Rank '+S.sk[s.id]+' of '+s.max+'.');refresh();save();}

function lifeRow(it,i,kind){const bt=$('bt-'+it.id),ds=$('ds-'+it.id),row=$('r-'+it.id);if(!bt)return;
  const h=S.home||0,c=S.cars||0,owned=kind==='home'?i<=h:i<c,next=kind==='home'?h+1:c,L=levelOf(S.lifetime);
  row.classList.toggle('locked',!owned&&i!==next);
  ds.textContent=it.txt+(it.bonus?` +${Math.round(it.bonus*100)}% income.`:'');
  if(owned){bt.disabled=true;bt.innerHTML=kind==='home'&&i<h?'<span>Moved out</span><b>✓</b>':kind==='home'?'<span>Living here</span><b>🏠</b>':'<span>Owned</span><b>✓</b>';}
  else if(i!==next||L<it.req){bt.disabled=true;bt.innerHTML=`<span>Needs</span><b>Lv ${it.req}</b>`;}
  else{bt.disabled=S.money<it.cost;bt.innerHTML=`<span>${kind==='home'?'Move in':'Buy'}</span><b>₱${fmt(it.cost)}</b>`;}}
function buyLife(kind,i){const arr=kind==='home'?HOMES:CARS,it=arr[i],next=kind==='home'?(S.home||0)+1:(S.cars||0);if(i!==next||levelOf(S.lifetime)<it.req||S.money<it.cost)return;S.money-=it.cost;if(kind==='home')S.home=i;else S.cars=i+1;syncLife();chime();
  toast(kind==='home'?'Welcome home!':'New ride!',kind==='home'?`You moved into your ${it.name.toLowerCase()}.`:it.id==='c9'?'Your private jet is circling over the farm.':`Your ${it.name.toLowerCase()} is parked by the house.`);refresh();save();}
const CATN={Genetics:'Develop pigs',Products:'New products to sell',Marketing:'Marketing'};
function reqMet(r){for(const k in r.req)if(lvOf(k)<r.req[k])return false;return true;}
function reqText(r){for(const k in r.req)if(lvOf(k)<r.req[k]){const b=B.find(x=>x.id===k);return lvOf(k)?`Needs ${b.name.toLowerCase()} Lv ${r.req[k]}.`:`Needs a ${b.name.toLowerCase()}.`;}return '';}
function startResearch(r){if(S.rs.cur||rDone(r.id)||!reqMet(r)||S.money<r.cost)return;S.money-=r.cost;S.rs.cur=r.id;S.rs.left=r.time;toast('Research started',r.name+'. Tap pigs to finish it faster.');oink(1.3);refresh();save();}
function finishResearch(){const r=R.find(x=>x.id===S.rs.cur);if(!r){S.rs.cur=null;return;}S.rs.done[r.id]=true;S.rs.cur=null;S.rs.left=0;chime();toast('Research complete: '+r.name,r.txt,'lesson',6500);if(r.eff.skin||r.eff.big)reskin();refresh();save();}
/* events */
let boomNext=100+Math.random()*120,sickNext=160+Math.random()*120,fiestaNext=90+Math.random()*60;
function renderEvents(){
  const ev=$('events');let h='';
  if(S.boostT>0)h+=`<div class="banner boost">📈 Pork prices are up: double income, ${Math.ceil(S.boostT)}s</div>`;
  if(S.fiestaT>0)h+=`<div class="banner boost">🎉 Fiesta! Taps earn ×5, ${Math.ceil(S.fiestaT)}s</div>`;
  if(S.sickT>0){const c=income()*2*12;h+=`<div class="banner sick">🤒 Some pigs are sick. Half income, ${Math.ceil(S.sickT)}s <button id="treat" ${S.money<c?'disabled':''}>Call vet ₱${fmt(c)}</button></div>`;}
  if(ev.innerHTML!==h){ev.innerHTML=h;const t=$('treat');if(t)t.onclick=()=>{const c=income()*2*12;if(S.money>=c){S.money-=c;S.sickT=0;toast('Pigs are healthy','The vet treated your herd.');setSick(false);}};}
}

/* ---------- Loop ---------- */
syncPigs();syncTrucks();setSick(S.sickT>0);syncLife();
B.forEach(b=>{if(lvOf(b.id))G[b.id].visible=true;});
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now(),uiT=0,saveT=0,clock=0;
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;clock+=dt;
  // economy
  earn(income()*dt);
  if(S.boostT>0)S.boostT=Math.max(0,S.boostT-dt);
  if(S.sickT>0){S.sickT=Math.max(0,S.sickT-dt);if(S.sickT===0)setSick(false);}
  boomNext-=dt;if(boomNext<=0){boomNext=150+Math.random()*150;if(lvOf('silo')){S.boostT=30*rEff('boom');toast('Market boom','Pork prices jumped. You earn double for '+Math.round(S.boostT)+' seconds.');chime();}}
  if(S.fiestaT>0)S.fiestaT=Math.max(0,S.fiestaT-dt);
  fiestaNext-=dt;if(fiestaNext<=0){fiestaNext=100+Math.random()*80;if(rDone('m3')){S.fiestaT=20;toast('Fiesta in town!','Everyone wants pork. Taps earn ×5 for 20 seconds. Tap tap tap!');chime();}}
  if(S.rs.cur){S.rs.left-=dt;if(S.rs.left<=0)finishResearch();}
  {const si=stageIdx();if(si>(S.stage||0)){S.stage=si;if(si>0){toast('New stage: '+STAGES[si][1],'Your business keeps growing. Check the Goals tab.');chime();}}}
  sickNext-=dt;if(sickNext<=0){sickNext=180+Math.random()*160;if(lvOf('pen')>=8&&S.sickT<=0&&Math.random()<.55*(1-.18*sk('vet'))*rEff('sick')){S.sickT=45;setSick(true);toast('Sick pigs','A bug is going around the herd. Call the vet or wait it out.');}}
  goldenNext-=dt;if(!golden&&goldenNext<=0){golden=makePig(true);pigGroup.add(golden);goldenT=14;toast('A golden piglet!','Tap it before it runs off.');}
  if(golden){goldenT-=dt;if(goldenT<=0){pigGroup.remove(golden);golden=null;goldenNext=gNext();}}
  // level up
  const L=levelOf(S.lifetime);
  if(L>S.lastLevel){S.lastLevel=L;S.fact=(S.fact||0)+1;chime();toast('Farmer level '+L+'!','+1 skill point. Farm lesson: '+FACTS[S.fact%FACTS.length],'lesson',7500);}
  if(!S.won&&S.lifetime>=1e9){S.won=true;save();modal('🏆','You are a pork billionaire!','From one backyard pig to a billion-peso business. Keep going and build a global pork empire.','Keep growing');}
  // world animation
  const allPigs=golden?pigs.concat([golden]):pigs;
  for(const p of allPigs){const u=p.userData,spd=u.gold?4.5:1.1;
    if(u.wait>0){u.wait-=dt;}else{const dx=u.tx-p.position.x,dz=u.tz-p.position.z,d=Math.hypot(dx,dz);
      if(d<.3){u.wait=u.gold?0:1+Math.random()*3;pickTarget(p);}else{const yaw=Math.atan2(-dz,dx);let dy=yaw-p.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));p.rotation.y+=dy*Math.min(1,dt*6);p.position.x+=dx/d*spd*dt;p.position.z+=dz/d*spd*dt;u.ph+=dt*(u.gold?20:9);}}
    u.legs.forEach((l,i)=>l.rotation.z=u.wait>0?0:Math.sin(u.ph+(i%2?Math.PI:0))*.5);
    if(u.hop>0){u.hop-=dt;p.position.y=Math.sin((.35-u.hop)/.35*Math.PI)*.9;}else p.position.y=u.gold?Math.abs(Math.sin(clock*8))*.25:S.fiestaT>0?Math.abs(Math.sin(clock*7+u.ph))*.5:0;}
  {const u=farmer.userData;if(u.wait>0)u.wait-=dt;else{const dx=u.tx-farmer.position.x,dz=u.tz-farmer.position.z,d=Math.hypot(dx,dz);if(d<.3){u.wait=2+Math.random()*3;u.tx=(Math.random()*2-1)*7;u.tz=(Math.random()*2-1)*5;}else{farmer.rotation.y=Math.atan2(dx,dz);farmer.position.x+=dx/d*1.6*dt;farmer.position.z+=dz/d*1.6*dt;fBody.position.y=1.75+Math.abs(Math.sin(clock*8))*.08;}}}
  for(const id in G){const g=G[id];if(!g.visible)continue;const base=1+Math.min(lvOf(id),100)*.003;if(g.userData.pop>0){g.userData.pop=Math.max(0,g.userData.pop-dt*3);g.scale.setScalar(base*(1+Math.sin(g.userData.pop*Math.PI)*.12));}else g.scale.setScalar(base);}
  trucks.forEach(t=>{t.userData.a+=dt*.12;const a=t.userData.a,r=39.2;t.position.set(Math.cos(a)*r,0,Math.sin(a)*r);t.rotation.y=-a-Math.PI/2;});
  if(G.port.visible){const s=G.port.userData.ship;s.position.y=-.6+Math.sin(clock*1.2)*.12;s.rotation.z=Math.sin(clock*.9)*.02;}
  G.lab.userData.helix.rotation.y+=dt*.8;
  if(VG[7].visible){const h=VG[7].userData.h,t=clock%30;h.userData.rotor.rotation.y+=dt*(t<20?6:30);h.position.y=t<20?0:t<24?(t-20)*2:t<28?8:(30-t)*4;}
  if(VG[8].visible){const a=clock*.2,j=VG[8];j.position.set(12+Math.cos(a)*30,24,16+Math.sin(a)*30);j.rotation.y=-a-Math.PI/2;}
  plane.visible=lvOf('cargo')>0;if(plane.visible){const a=clock*.15;plane.position.set(30+Math.cos(a)*55,28,Math.sin(a)*55);plane.rotation.y=-a-Math.PI/2;}
  moon.visible=lvOf('moon')>0;if(moon.visible){const rk=G.moon.userData.rocket,t=clock%26;rk.position.y=t>18?.8+Math.pow(t-18,2)*2.2:.8;rk.visible=t<25.5;}
  cam.r+=(cam.tr-cam.r)*Math.min(1,dt*8);placeCam();
  renderer.render(scene,camera);
  uiT+=dt;if(uiT>.2){uiT=0;refresh();renderEvents();}
  saveT+=dt;if(saveT>5){saveT=0;save();}
  requestAnimationFrame(frame);
}

/* offline earnings */
const away=(Date.now()-(S.t||Date.now()))/1000;
const offRate=.1+.18*sk('auto');
build();
if(away>60&&S.lifetime>0){
  const base=income()/(S.boostT>0?2:1);
  const secs=Math.min(away,8*3600),got=base*secs*offRate;
  if(got>0){earn(got);modal('🐷','Welcome back!',`Your farm kept working while you were away and earned ₱${fmt(got)}. Learn Farm automation to earn more while you are gone.`,'Collect');}
}else if(S.lifetime===0){
  modal('🧑‍🌾','Welcome to Babuyan','You are a young farmer with one pig and a dream. Tap your pig to earn cash, build up your farm, and learn as you level up. Can you grow it into a billion-peso business?','Start farming');
}
S.lastLevel=Math.max(S.lastLevel,levelOf(S.lifetime));S.stage=Math.max(S.stage||0,stageIdx());
addEventListener('visibilitychange',()=>{if(document.hidden)save();else last=performance.now();});
addEventListener('pagehide',save);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
