name: Build Babuyan APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: App icon and portrait mode
        run: |
          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher.png
            cp icons/ic_launcher-$d.png $RES/mipmap-$d/ic_launcher_round.png
          done
          rm -rf $RES/mipmap-anydpi-v26
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy game into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Babuyan.apk

      - name: Save APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Babuyan-apk
          path: Babuyan.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Babuyan build ${{ github.run_number }}
          files: Babuyan.apk
